<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Convex Funding">
  <title>Convex Funding</title>

  <!--
    Favicon-specific redraw, NOT the ConvexMark geometry scaled down.

    The real mark is 939x1000 with six bars, the narrowest 53.5 units wide — 5.7%
    of the width. Scaled into a 16px tab icon that bar is half a pixel and simply
    disappears, and the swoosh's taper (4.7% of height at its thinnest) goes with
    it. What survives is mud.

    So this keeps the composition that makes the mark recognisable — ascending
    bars with the green curve sweeping above them, left to right — and rebuilds it
    at weights that hold at 16px: four bars instead of six, each 9 units of 64
    (14%), and the swoosh as a round-capped stroke rather than a tapered fill.

    Colours are the `onDark` palette from ConvexMark.jsx, because this always sits
    on the ink tile below, never on white.
  -->

  <rect width="64" height="64" rx="14" fill="#070B11"/>

  <!-- Ascending bars, all sitting on a common baseline at y=52. -->
  <g>
    <rect x="11" y="40" width="9" height="12" fill="#158C77"/>
    <rect x="23" y="33" width="9" height="19" fill="#0E6E7C"/>
    <rect x="35" y="25" width="9" height="27" fill="#2C5A85"/>
    <rect x="47" y="17" width="9" height="35" fill="#2C5A85"/>
  </g>

  <!-- The swoosh, drawn last so it passes in front of the bars exactly as it does
       in the full mark. -->
  <path d="M 9 47 C 23 44, 34 33, 56 10"
        fill="none"
        stroke="#2FC98F"
        stroke-width="5"
        stroke-linecap="round"/>
</svg>
